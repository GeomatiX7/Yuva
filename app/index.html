<!doctype html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="description" content="Notas, documentos, tareas y bases de datos en tu equipo, sin internet · Notes, docs, tasks and databases on your device, offline." />

    <title>Yuva</title>
    <!-- Pantalla de arranque: va aquí, en línea, para que se vea desde el primer instante, antes de que cargue
         la app (en el programa de escritorio la ventana se muestra con el primer cuadro pintado).
         La app la cierra al estar lista (src/lib/pantallaArranque.ts). Logo v4 (marca/yuva/v4/elegido/) y logotipo v5 (marca/yuva/v5-logotipo/). -->
    <style>
      #arranque {
        --fondo-arranque: #fcf8f7;
        --vino: #5e1a2d;
        --oro: #be8d47;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--fondo-arranque);
        color: var(--vino);
        contain: strict;
      }
      #arranque[data-tema='oscuro'] { --fondo-arranque: #1c1215; color: #f2e9ea; }
      #arranque .ar-marca { display: grid; justify-items: center; gap: 22px; position: relative; }
      #arranque .ar-logo { width: 132px; height: 132px; overflow: visible; }
      #arranque .ar-nombre { width: 118px; height: auto; overflow: visible; }
      #arranque[data-tema='oscuro'] .ar-oro { fill: #d9a85a; }
      #arranque .ar-destello { fill: #f4d88f; opacity: 0.9; }
      #arranque[data-tema='oscuro'] .ar-destello { fill: #eac46f; }
      /* Sombra de contacto: el logo «aterriza» sobre la página. */
      #arranque .ar-sombra {
        position: absolute;
        left: 50%;
        top: 134px;
        width: 124px;
        height: 18px;
        margin-left: -62px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(42, 10, 18, 0.26), transparent);
        opacity: 0;
        pointer-events: none;
      }
      #arranque[data-tema='oscuro'] .ar-sombra { background: radial-gradient(closest-side, rgba(0, 0, 0, 0.55), transparent); }
      #arranque .ar-onda {
        position: absolute;
        left: 50%;
        top: 66px;
        width: 132px;
        height: 132px;
        margin: -66px 0 0 -66px;
        border-radius: 34%;
        border: 2px solid var(--vino);
        opacity: 0;
        pointer-events: none;
      }
      #arranque[data-tema='oscuro'] .ar-onda { border-color: #c88b98; }
      #arranque .ar-onda.oro { border-color: var(--oro); border-width: 1.5px; }
      #arranque .ar-brillo { opacity: 0; }
      /* Logo en 3D (renderizado en Blender: marca/yuva/v4/3d/). El cuadro ocupa 2/3 del video. */
      #arranque .ar-video {
        position: absolute;
        left: 50%;
        top: 66px;
        width: 200px;
        height: 200px;
        margin: -100px 0 0 -100px;
        opacity: 0;
        pointer-events: none;
      }
      #arranque.con-video .ar-video { opacity: 1; }
      #arranque.con-video .ar-logo { visibility: hidden; }
      #arranque.espera .ar-marca { visibility: hidden; }
      #arranque .ar-luz {
        position: absolute;
        left: 50%;
        top: 66px;
        width: 132px;
        height: 132px;
        margin: -66px 0 0 -66px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(234, 196, 111, 0.42), rgba(94, 26, 45, 0.16) 46%, transparent 70%);
        opacity: 0;
        pointer-events: none;
      }

      /* Animación completa: «plin» al aparecer el rollo dorado, «boom» suave al desplegarse. */
      #arranque.anima .ar-cuadro { transform-box: view-box; transform-origin: 256px 256px; animation: ar-pop 520ms cubic-bezier(0.34, 1.56, 0.64, 1) 40ms both; }
      #arranque.anima .ar-letra { animation: ar-sube 420ms cubic-bezier(0.2, 0.8, 0.2, 1) 220ms both; }
      #arranque.anima .ar-rollo { transform-box: view-box; transform-origin: 300px 200px; animation: ar-rollo 520ms cubic-bezier(0.34, 1.56, 0.64, 1) 340ms both; }
      #arranque.anima .ar-brillo { transform-box: fill-box; transform-origin: center; animation: ar-brillo 620ms ease-out 400ms both; }
      /* Texto: cada letra sube desde una línea invisible y se junta con las demás (llegan algo separadas);
         luego la diagonal dorada de la Y entra por su propio ángulo y un brillo recorre la palabra. */
      #arranque.anima .ar-nombre .l1,
      #arranque.anima .ar-nombre .l2,
      #arranque.anima .ar-nombre .l3,
      #arranque.anima .ar-nombre .l4 { animation: ar-letra 600ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      #arranque.anima .ar-nombre .l1 { --dx: -54px; animation-delay: 480ms; }
      #arranque.anima .ar-nombre .l2 { --dx: -18px; animation-delay: 545ms; }
      #arranque.anima .ar-nombre .l3 { --dx: 18px; animation-delay: 610ms; }
      #arranque.anima .ar-nombre .l4 { --dx: 54px; animation-delay: 675ms; }
      #arranque.anima .ar-nombre .ar-oro { animation: ar-oro 560ms cubic-bezier(0.34, 1.4, 0.64, 1) 820ms both; }
      #arranque.anima .ar-barrido { animation: ar-barrido 760ms cubic-bezier(0.45, 0, 0.25, 1) 1160ms both; }
      #arranque.anima .ar-sombra { animation: ar-sombra 640ms cubic-bezier(0.2, 0.8, 0.2, 1) 120ms both; }
      #arranque.anima .ar-marca { animation: ar-boom 420ms cubic-bezier(0.34, 1.56, 0.64, 1) 1000ms both; }
      #arranque.anima .ar-luz { animation: ar-luz 950ms cubic-bezier(0.2, 0.8, 0.2, 1) 1000ms both; }
      #arranque.anima .ar-onda { animation: ar-onda 900ms cubic-bezier(0.2, 0.8, 0.2, 1) 1040ms both; }
      #arranque.anima .ar-onda.oro { animation-delay: 1120ms; animation-duration: 1000ms; }
      #arranque.sale { animation: ar-fuera 380ms cubic-bezier(0.5, 0, 0.75, 0) both; pointer-events: none; }
      #arranque.sale .ar-marca { animation: ar-aleja 380ms cubic-bezier(0.5, 0, 0.75, 0) both; }
      /* Movimiento reducido (o al recargar): el logo quieto y un fundido rápido. */
      #arranque.quieto.sale { animation-duration: 200ms; }
      /* Al recargar en la misma sesión (la animación ya se vio), más corto todavía. */
      #arranque.quieto.recarga.sale { animation-duration: 120ms; }
      #arranque.quieto.sale .ar-marca { animation: none; }

      @keyframes ar-pop {
        0% { transform: scale(0.4) rotate(-14deg); opacity: 0; }
        60% { opacity: 1; }
        100% { transform: none; opacity: 1; }
      }
      @keyframes ar-sube { from { transform: translateY(70px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes ar-rollo {
        0% { transform: scale(0) rotate(-70deg); opacity: 0; }
        40% { opacity: 1; }
        100% { transform: none; opacity: 1; }
      }
      @keyframes ar-brillo {
        0% { transform: scale(0) rotate(0deg); opacity: 0; }
        35% { transform: scale(1.15) rotate(45deg); opacity: 1; }
        100% { transform: scale(0.2) rotate(90deg); opacity: 0; }
      }
      @keyframes ar-letra { from { transform: translate(var(--dx, 0px), 236px); } to { transform: none; } }
      @keyframes ar-oro {
        0% { transform: translate(76px, -172px); opacity: 0; }
        25% { opacity: 1; }
        100% { transform: none; opacity: 1; }
      }
      @keyframes ar-barrido { from { transform: translateX(0) skewX(-18deg); } to { transform: translateX(1000px) skewX(-18deg); } }
      @keyframes ar-sombra { from { transform: scale(0.3); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes ar-boom {
        0% { transform: none; }
        30% { transform: scale(0.955); }
        65% { transform: scale(1.04); }
        100% { transform: none; }
      }
      @keyframes ar-luz {
        0% { transform: scale(0.6); opacity: 0; }
        15% { opacity: 1; }
        100% { transform: scale(7); opacity: 0; }
      }
      @keyframes ar-onda {
        0% { transform: scale(0.95); opacity: 0; }
        6% { transform: scale(1.1); opacity: 0.6; }
        100% { transform: scale(9); opacity: 0; border-width: 0.5px; }
      }
      @keyframes ar-fuera { to { opacity: 0; } }
      @keyframes ar-aleja { to { transform: scale(1.08); } }
    </style>
  </head>

    <script>
      // Arranque: decide al momento (sin esperar a la app) el fondo, si hay animación y si suena.
      // La app deja en localStorage «yuva:arranque» su tema, el movimiento y el ajuste de sonido.
      (function () {
        var el = document.getElementById('arranque');
        var pref = {};
        try { pref = JSON.parse(localStorage.getItem('yuva:arranque') || '{}') || {}; } catch (e) {}
        var oscuro = pref.tema ? pref.tema === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches;
        el.dataset.tema = oscuro ? 'oscuro' : 'claro';
        if (/^#[0-9a-f]{6}$/i.test(pref.fondo || '')) el.style.setProperty('--fondo-arranque', pref.fondo);
        var visto = false;
        try { visto = sessionStorage.getItem('yuva:arranque-visto') === '1'; sessionStorage.setItem('yuva:arranque-visto', '1'); } catch (e) {}
        var reducido = pref.movimiento === 'reducido' || matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Con la ventana oculta (el programa abierto en la bandeja al iniciar Windows) no se anima ni suena.
        var oculta = document.visibilityState === 'hidden';
        var completa = !reducido && !visto && !oculta;
        var inicio = performance.now();
        // Al recargar en la misma sesión (cambio de idioma o de espacio) la animación ya se vio: la pantalla se va
        // en cuanto la app está lista, con un fundido corto. El primer arranque sigue con su animación completa.
        var minimo = completa ? 1800 : oculta || visto ? 0 : 250;
        var fundido = completa ? 380 : visto ? 120 : 200;
        var listo = false;
        var terminado = false;

        function sonar() {
          // Sonido propio, hecho aquí con Web Audio: un «plin» de campanita y un «boom» grave y corto.
          if (pref.sonido === false) return;
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          try {
            var ctx = new Ctx();
            // Se cierra una sola vez (a los 300 ms si no pudo sonar, o al terminar): cerrar dos veces rechaza la promesa.
            var cerrar = function () {
              if (ctx.state === 'closed') return;
              var p = ctx.close();
              if (p && p.catch) p.catch(function () {});
            };
            // Los navegadores no dejan sonar antes de que la persona toque la página: entonces se calla.
            // Si sigue suspendido un instante después, no sonará: se cierra sin más.
            setTimeout(function () {
              window.yuvaArranque.sonido = ctx.state === 'running';
              if (ctx.state !== 'running') cerrar();
            }, 300);
            var t0 = ctx.currentTime + 0.02;
            var salida = ctx.createDynamicsCompressor();
            var maestro = ctx.createGain();
            maestro.gain.value = 0.55;
            salida.connect(maestro).connect(ctx.destination);
            function tono(f, desde, dura, vol, forma, hasta) {
              var o = ctx.createOscillator();
              var g = ctx.createGain();
              o.type = forma || 'sine';
              o.frequency.setValueAtTime(f, t0 + desde);
              if (hasta) o.frequency.exponentialRampToValueAtTime(hasta, t0 + desde + dura * 0.7);
              g.gain.setValueAtTime(0.0001, t0 + desde);
              g.gain.exponentialRampToValueAtTime(vol, t0 + desde + 0.008);
              g.gain.exponentialRampToValueAtTime(0.0001, t0 + desde + dura);
              o.connect(g).connect(salida);
              o.start(t0 + desde);
              o.stop(t0 + desde + dura + 0.05);
            }
            // «plin»: campanita con parciales de campana (no armónicos), cuando aparece el rollo dorado.
            tono(1318.5, 0.4, 0.9, 0.16);
            tono(1318.5 * 2.76, 0.4, 0.45, 0.05);
            tono(1318.5 * 5.4, 0.4, 0.2, 0.018);
            tono(1975.5, 0.5, 0.7, 0.07);
            // «boom»: una nota grave que cae y un soplo de ruido filtrado, cuando el logo se despliega.
            tono(150, 1.02, 0.95, 0.42, 'sine', 46);
            tono(300, 1.02, 0.45, 0.08, 'triangle', 92);
            var n = Math.floor(ctx.sampleRate * 0.7);
            var buf = ctx.createBuffer(1, n, ctx.sampleRate);
            var d = buf.getChannelData(0);
            for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
            var ruido = ctx.createBufferSource();
            ruido.buffer = buf;
            var filtro = ctx.createBiquadFilter();
            filtro.type = 'lowpass';
            filtro.frequency.setValueAtTime(900, t0 + 1.0);
            filtro.frequency.exponentialRampToValueAtTime(120, t0 + 1.6);
            var gr = ctx.createGain();
            gr.gain.setValueAtTime(0.0001, t0 + 1.0);
            gr.gain.exponentialRampToValueAtTime(0.12, t0 + 1.04);
            gr.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.7);
            ruido.connect(filtro).connect(gr).connect(salida);
            ruido.start(t0 + 1.0);
            setTimeout(cerrar, 2600);
          } catch (e) {}
        }
        // Con animación completa, el logo en 3D (video) si empieza a tiempo; si no, el SVG animado.
        // La animación y el sonido arrancan juntos cuando empieza el video, para ir a la par.
        var video = el.querySelector('.ar-video');
        var empezado = false;
        function empezar(conVideo) {
          if (empezado) return;
          empezado = true;
          inicio = performance.now();
          el.className = 'anima' + (conVideo ? ' con-video' : '');
          if (!conVideo && video) video.remove();
          sonar();
          intentar();
        }
        if (!completa) {
          el.className = visto ? 'quieto recarga' : 'quieto';
          if (video) video.remove();
        } else if (video && video.canPlayType('video/webm; codecs="vp9"')) {
          el.className = 'espera';
          video.addEventListener('playing', function () {
            if (window.yuvaArranque) window.yuvaArranque.video = Math.round(performance.now() - inicio);
            empezar(true);
          }, { once: true });
          var reproduce = video.play();
          if (reproduce && reproduce.catch) reproduce.catch(function () { empezar(false); });
          setTimeout(function () { empezar(false); }, 600);
        } else empezar(false);

        function quitar() {
          if (terminado) return;
          terminado = true;
          el.classList.add('sale');
          setTimeout(function () {
            el.remove();
            window.yuvaArranque.terminado = true;
            window.dispatchEvent(new Event('yuva:arranque-fin'));
          }, fundido);
        }
        function intentar() {
          if (!listo || terminado || (completa && !empezado)) return;
          setTimeout(quitar, Math.max(0, minimo - (performance.now() - inicio)));
        }
        window.yuvaArranque = {
          terminado: false,
          animado: completa,
          listo: function () { listo = true; intentar(); },
        };
        // Por si la app no llega a avisar (un error al abrir): nunca tapa la pantalla más de 8 s.
        setTimeout(function () { listo = true; quitar(); }, 8000);
      })();
    </script>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
