# Compila Yuva para Windows a partir del código y deja una publicación BORRADOR en Releases con el
# instalador, su .blockmap y latest.yml (lo que leen las actualizaciones). El autor la revisa y la publica.
#
# Se lanza al subir una etiqueta vX.Y.Z (git tag v0.7.1 && git push origin v0.7.1) o a mano desde la
# pestaña Actions. La etiqueta tiene que coincidir con la versión de escritorio/package.json.
name: Publicar versión

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # crear la publicación y subir sus archivos

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            escritorio/package-lock.json

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(node -p "require('./escritorio/package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la versión $VERSION de escritorio/package.json"; exit 1
          fi

      - name: Dependencias de la app
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependencias del programa de escritorio
        working-directory: escritorio
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Compila la app (avisos de terceros, TypeScript y Vite) y la copia a escritorio/web.
      - name: Compilar la app
        working-directory: escritorio
        run: node preparar.cjs

      # Se crea antes el borrador: si no existe, electron-builder sube los archivos en paralelo y cada subida
      # puede crear su propio borrador (en la 0.7.1 salieron dos, con los archivos repartidos).
      - name: Crear la publicación borrador
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --draft --title "Yuva ${GITHUB_REF_NAME#v}" --notes "Novedades: (escríbelas antes de publicar)"

      # Los iconos (escritorio/recursos/*.png) ya están en el repositorio: no se regeneran aquí.
      - name: Empaquetar y subir a una publicación borrador
        working-directory: escritorio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: 'true'
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Guardar el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: yuva-instalador
          path: |
            escritorio/instalador/*.exe
            escritorio/instalador/*.blockmap
            escritorio/instalador/latest.yml
          retention-days: 14
